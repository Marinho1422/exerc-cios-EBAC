<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco do Marinho</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="container">
        <h1>Banco do Marinho</h1>
        <h2>Faça seu depósito</h2>
        <form id="formulario-deposito">
            <input type="number" id="campo-A" required placeholder="Insira um valor" />
            <input type="number" id="campo-B" required placeholder="Insira um valor maior que o campo anterior" />
            <button type="submit"> Depositar </button>
        </form>
        <p id="mensagem" style="font-weight: bold; margin-top: 10px;"></p>
    </div>
    <script src="main.js"></script>
</body>
</html>
